<text x="705" y="350" font-family="Arial,sans-serif" font-size="23" fill="#183040" font-weight="bold">Which site ranks first?</text>
<text x="705" y="398" font-family="Arial,sans-serif" font-size="16" fill="#50666d" font-weight="normal">Balanced</text>
<text x="705" y="426" font-family="Arial,sans-serif" font-size="22" fill="#183040" font-weight="bold">Fictional South</text>
<text x="705" y="473" font-family="Arial,sans-serif" font-size="16" fill="#50666d" font-weight="normal">Access first</text>
<text x="705" y="501" font-family="Arial,sans-serif" font-size="22" fill="#183040" font-weight="bold">Fictional North</text>
<text x="705" y="548" font-family="Arial,sans-serif" font-size="16" fill="#50666d" font-weight="normal">Low competition</text>
<text x="705" y="576" font-family="Arial,sans-serif" font-size="22" fill="#183040" font-weight="bold">Fictional South</text>
<text x="40" y="682" font-family="Arial,sans-serif" font-size="18" fill="#183040" font-weight="bold">Decision: shortlist for investigation; validate actual demand, rents and travel times before investing.</text>
<text x="40" y="718" font-family="Arial,sans-serif" font-size="16" fill="#50666d" font-weight="normal">All businesses, point locations and demand values are invented. Scores are heuristics, not revenue predictions.</text>
<text x="40" y="746" font-family="Arial,sans-serif" font-size="15" fill="#50666d" font-weight="normal">Straight-line distances / no observed foot traffic / no causal claims / no Placer.ai data</text>
